<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EazyBIM | طلباتي الهندسية</title>
<style>
:root{--bg:#f2f5f9;--surface:#fff;--text:#152b46;--muted:#718197;--border:#dce5ef;--blue:#0755a5;--blue-soft:#e9f2fc;--green:#08784d;--green-soft:#e8f7ef;--amber:#946012;--amber-soft:#fff3d9;--radius:12px;--shadow:0 2px 8px #152b4606}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;font-size:14px;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93bff0;outline-offset:2px}button{color:inherit}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.page{max-width:1160px;margin:auto;padding:36px 28px 60px}.breadcrumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:12px}.breadcrumb svg{width:14px;height:14px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}h1{font-size:28px;line-height:1.4;margin:0 0 5px;font-weight:750;letter-spacing:-.6px}.subtitle{margin:0;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:1px solid var(--border);border-radius:8px;background:white;font-weight:600;white-space:nowrap}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#064686}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}.stat{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:19px;text-align:right;box-shadow:var(--shadow);min-width:0}.stat:hover{border-color:#91b6de}.stat-icon{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}.stat-icon.warning{color:var(--amber);background:var(--amber-soft)}.stat-icon.success{color:var(--green);background:var(--green-soft)}.stat-label{color:var(--muted);font-size:13px}.stat-number{font-size:28px;font-weight:750;line-height:1.3;font-variant-numeric:tabular-nums}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:9px 12px;border-radius:8px;white-space:nowrap}.tab:hover{background:#e6edf5}.tab[aria-pressed=true]{background:var(--blue-soft);color:var(--blue)}.tab-count{margin-inline-start:4px;font-size:11px}.tools{display:flex;gap:8px;align-items:center}.search{display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--muted)}.search svg{width:17px;height:17px}.search input{border:0;outline:none;background:transparent;width:155px;color:var(--text)}.search:focus-within{border-color:var(--blue)}.search input:focus-visible{outline:none}.sort{position:relative}.sort select{appearance:none;max-width:145px;background:white;border:1px solid var(--border);border-radius:8px;padding:8px 34px 8px 10px;color:var(--text);cursor:pointer}.sort svg{position:absolute;right:10px;top:10px;width:17px;height:17px;pointer-events:none;color:var(--muted)}.list-header{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;color:var(--muted);font-size:12px}.request-list{display:grid;gap:12px}.request{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}.request:hover{border-color:#b9cce2;box-shadow:0 3px 14px #152b460b}.request.needs-action{border-inline-start:3px solid #dca744}.request-top{display:flex;align-items:flex-start;gap:13px;padding:18px 20px 15px}.request-icon{height:46px;width:46px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);border-radius:10px;flex:none}.request-icon svg{width:24px;height:24px}.request-title{flex:1;min-width:0}.request-title h2{font-size:16px;font-weight:700;margin:0 0 4px;line-height:1.5;overflow-wrap:anywhere}.request-title p{margin:0;color:var(--muted);font-size:13px}.request-title .project{margin-top:4px;font-size:12px;display:flex;align-items:center;gap:5px}.project svg{width:14px;height:14px}.status{display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:650;white-space:nowrap;color:var(--green);background:var(--green-soft)}.status:before{content:'';height:6px;width:6px;border-radius:50%;background:currentColor}.status.warning{background:var(--amber-soft);color:var(--amber)}.status.progress{background:var(--blue-soft);color:var(--blue)}.status.closed{background:#eef1f5;color:#687486}.menu-wrap{position:relative}.icon-btn{border:0;background:transparent;border-radius:7px;color:var(--muted);display:grid;place-items:center;width:30px;height:30px}.icon-btn:hover{background:var(--bg);color:var(--text)}.menu{position:absolute;top:34px;left:0;min-width:150px;background:white;box-shadow:0 8px 24px #152b4620;border:1px solid var(--border);border-radius:8px;padding:5px;z-index:2}.menu button{display:block;width:100%;text-align:right;border:0;border-radius:5px;background:none;padding:8px 10px}.menu button:hover{background:var(--bg)}[hidden]{display:none!important}.request-bottom{border-top:1px solid #edf1f5;display:flex;align-items:center;gap:30px;padding:13px 20px}.metric{min-width:125px}.metric-label{font-size:12px;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:5px}.metric-label svg{height:15px;width:15px}.metric-value{font-size:14px;font-weight:650}.offers-positive{color:var(--blue)}.new-count{font-size:11px;margin-inline-start:6px;font-weight:600;color:var(--blue)}.deadline-soon{color:var(--amber)}.action{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:700;background:transparent;border:0;padding:8px 10px;border-radius:7px;white-space:nowrap}.action:hover{background:var(--blue-soft)}.action svg{height:16px;width:16px}.action.important{background:var(--blue);color:white;padding:9px 14px}.action.important:hover{background:#064686}.empty{background:white;border:1px dashed #cbd8e6;border-radius:var(--radius);padding:50px 15px;text-align:center;color:var(--muted)}.empty svg{width:34px;height:34px;margin-bottom:8px}.empty h2{font-size:17px;color:var(--text);margin:0 0 5px}.empty p{margin:0 0 16px}.demo-note{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}dialog{border:1px solid var(--border);border-radius:15px;width:min(500px,calc(100% - 28px));padding:0;color:var(--text);box-shadow:0 15px 70px #152b4630}dialog::backdrop{background:#132b4655}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}.dialog-head h2{font-size:18px;margin:0}.dialog-body{padding:22px}.dialog-body p{margin-top:0}.dialog-body label{display:block;font-weight:600;margin:0 0 6px}.field{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;background:white;color:var(--text);margin-bottom:15px}.dialog-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.detail-line{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding:10px 0}.detail-line span:first-child{color:var(--muted)}.toast{position:fixed;bottom:24px;left:24px;background:#152b46;color:white;border-radius:9px;padding:12px 18px;z-index:4;box-shadow:var(--shadow)}
@media(max-width:700px){.page{padding:24px 14px 40px}.heading{align-items:flex-start}h1{font-size:22px}.subtitle{font-size:12px}.heading .btn{font-size:12px;padding:9px}.stats{gap:7px;margin-bottom:18px}.stat{padding:11px;gap:7px;align-items:flex-start;flex-direction:column}.stat-icon{width:32px;height:32px}.stat-icon svg{width:17px;height:17px}.stat-label{font-size:11px}.stat-number{font-size:23px}.tools{width:100%}.search{flex:1}.search input{width:100%}.tabs{gap:1px}.tab{padding:8px;font-size:12px}.request-top{padding:14px 12px;gap:8px;flex-wrap:wrap}.request-icon{height:36px;width:36px}.request-icon svg{width:20px;height:20px}.request-title{flex-basis:calc(100% - 85px)}.request-title h2{font-size:14px}.status{margin-inline-start:44px}.menu-wrap{margin-inline-start:auto}.request-bottom{padding:12px;gap:12px;flex-wrap:wrap}.metric{min-width:0;flex:1}.metric-value{font-size:12px}.action{font-size:12px;padding:6px}.action.important{padding:8px}.new-count{display:block;margin:0}.metric-label{font-size:11px}}
@media(max-width:380px){.request-bottom .action{width:100%;justify-content:center}.heading .btn{white-space:normal}.heading{gap:8px}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M5 12h14"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8m-8 4h8"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="i-design" viewBox="0 0 24 24"><path d="m12 2 9 18H3L12 2zM8 15h8M12 2v4M5 20v2m14-2v2"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</defs></svg>
<main class="page">
  <nav class="breadcrumb" aria-label="مسار الصفحة"><span>المشاريع</span><svg><use href="#i-chevron"/></svg><span>طلبات الخدمات الهندسية</span></nav>
  <header class="heading"><div><h1>طلباتي الهندسية</h1><p class="subtitle">تابع طلباتك، واستعرض العروض، وأدر خدماتك الهندسية.</p></div><button class="btn primary" id="new-request"><svg><use href="#i-plus"/></svg> طلب خدمة جديد</button></header>
  <section class="stats" aria-label="ملخص الطلبات">
    <button class="stat" data-filter="active"><span class="stat-icon"><svg><use href="#i-file"/></svg></span><span><span class="stat-label">الطلبات النشطة</span><span class="stat-number" id="active-count" style="display:block">0</span></span></button>
    <button class="stat" data-filter="confirm"><span class="stat-icon warning"><svg><use href="#i-clock"/></svg></span><span><span class="stat-label">بانتظار إجراء</span><span class="stat-number" id="confirm-count" style="display:block">0</span></span></button>
    <button class="stat" data-filter="complete"><span class="stat-icon success"><svg><use href="#i-check"/></svg></span><span><span class="stat-label">مكتملة</span><span class="stat-number" id="complete-count" style="display:block">0</span></span></button>
  </section>
  <section aria-label="قائمة الطلبات">
    <div class="toolbar"><div class="tabs" id="tabs" role="group" aria-label="تصفية الطلبات"></div><div class="tools"><label class="search"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="ابحث عن طلب..." aria-label="ابحث عن طلب"></label><label class="sort"><svg><use href="#i-filter"/></svg><select id="sort" aria-label="ترتيب الطلبات"><option value="priority">الأولوية</option><option value="recent">الأحدث</option><option value="deadline">أقرب موعد</option><option value="offers">عدد العروض</option></select></label></div></div>
    <div class="list-header"><span id="result-count" aria-live="polite"></span><span>طلبات الخدمات</span></div>
    <div class="request-list" id="request-list"></div>
  </section>
  <p class="demo-note">نموذج واجهة تجريبي — البيانات والعروض المعروضة افتراضية.</p>
</main>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" id="close-dialog" aria-label="إغلاق"><svg><use href="#i-x"/></svg></button></div><div class="dialog-body" id="dialog-body"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const states = {open:{label:'تستقبل العروض',style:'',action:'عرض التفاصيل'},confirm:{label:'بانتظار تأكيدك',style:'warning',action:'مراجعة الاتفاق'},progress:{label:'قيد التنفيذ',style:'progress',action:'متابعة التنفيذ'},complete:{label:'مكتملة',style:'closed',action:'تقييم مقدم الخدمة'},cancelled:{label:'ملغاة',style:'closed',action:'عرض التفاصيل'}};
const filters = [['all','الكل'],['open','تستقبل العروض'],['confirm','بانتظار التأكيد'],['progress','قيد التنفيذ'],['complete','المكتملة'],['cancelled','الملغاة']];
let requests = [
{id:1,title:'تصميم فيلا سكنية حديثة بحي النرجس',service:'تصميم معماري',project:'',deadline:'2026-12-02',created:'2026-11-24',offers:3,newOffers:2,status:'open'},
{id:2,title:'تصميم وحصر كميات لمبنى سكني',service:'تصميم معماري · حصر كميات',project:'',deadline:'2026-12-12',created:'2026-11-26',offers:0,newOffers:0,status:'open'},
{id:3,title:'تصميم معماري لمبنى تجاري',service:'تصميم معماري',project:'المبنى التجاري',deadline:'2026-12-11',created:'2026-11-25',offers:2,newOffers:0,status:'confirm'},
{id:4,title:'حصر كميات لمشروع فيلا سكنية',service:'حصر كميات',project:'',deadline:'2026-11-19',created:'2026-11-10',offers:4,newOffers:0,status:'complete'}
];
let filter='all'; const $=id=>document.getElementById(id); const list=$('request-list'); const dialog=$('dialog');
const matches=(r,f)=>f==='all'||(f==='active'?['open','confirm','progress'].includes(r.status):r.status===f);
const dateFormat=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const dateText=s=>s?dateFormat.format(new Date(s+'T00:00:00Z')):'غير محدد';
const offerText=n=>n===0?'لا توجد عروض':n===1?'عرض واحد':n===2?'عرضان':n<=10?`${n} عروض`:`${n} عرضًا`;
const setFilter=f=>{filter=f;render()};
function render(){
 $('active-count').textContent=requests.filter(r=>matches(r,'active')).length;
 $('confirm-count').textContent=requests.filter(r=>r.status==='confirm').length;
 $('complete-count').textContent=requests.filter(r=>r.status==='complete').length;
 $('tabs').innerHTML=filters.map(([key,label])=>`<button class="tab" data-filter="${key}" aria-pressed="${filter===key}">${label}${key==='all'?`<span class="tab-count">(${requests.length})</span>`:''}</button>`).join('');
 const term=$('search').value.trim().toLowerCase();
 let rows=requests.filter(r=>matches(r,filter)&&[r.title,r.service,r.project].join(' ').toLowerCase().includes(term));
 const priority=r=>r.status==='confirm'?0:r.status==='open'&&r.newOffers?1:r.status==='progress'?2:r.status==='open'?3:4;
 const sort=$('sort').value;
 rows.sort((a,b)=>sort==='recent'?b.created.localeCompare(a.created)||b.id-a.id:sort==='deadline'?(a.deadline||'9999').localeCompare(b.deadline||'9999'):sort==='offers'?b.offers-a.offers:priority(a)-priority(b)||b.created.localeCompare(a.created));
 $('result-count').textContent=`عرض ${rows.length} من ${requests.length} طلبات`;
 list.innerHTML=rows.length?rows.map(card).join(''):`<div class="empty">${icon('folder')}<h2>لا توجد طلبات مطابقة</h2><p>جرّب تغيير الفلتر أو البحث بكلمات أخرى.</p><button class="btn" data-reset>عرض جميع الطلبات</button></div>`;
}
function card(r){const s=states[r.status];const action=r.status==='open'&&r.offers?'استعراض العروض':s.action;return `<article class="request ${r.status==='confirm'?'needs-action':''}"><div class="request-top"><div class="request-icon">${icon('design')}</div><div class="request-title"><h2>${esc(r.title)}</h2><p>${esc(r.service)}</p>${r.project?`<p class="project">${icon('folder')}${esc(r.project)}</p>`:''}</div><span class="status ${s.style}">${s.label}</span><div class="menu-wrap"><button class="icon-btn" data-menu="${r.id}" aria-label="خيارات الطلب" aria-expanded="false">${icon('more')}</button><div class="menu" id="menu-${r.id}" hidden><button data-detail="${r.id}">عرض التفاصيل</button>${r.status==='open'?`<button data-cancel="${r.id}">إلغاء الطلب</button>`:''}</div></div></div><div class="request-bottom"><div class="metric"><div class="metric-label">${icon('file')} العروض المستلمة</div><div class="metric-value ${r.offers?'offers-positive':''}">${offerText(r.offers)}${r.newOffers?`<span class="new-count">${r.newOffers} جديدة</span>`:''}</div></div><div class="metric"><div class="metric-label">${icon('calendar')} آخر موعد للتقديم</div><div class="metric-value">${dateText(r.deadline)}</div></div><button class="action ${r.status==='confirm'?'important':''}" data-action="${r.id}">${action}${icon('left')}</button></div></article>`}
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.hidden=true);document.querySelectorAll('[data-menu]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function showDialog(title,body){$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;dialog.showModal()}
function showDetail(r,mode){const title=mode==='action'?(r.status==='open'&&r.offers?'استعراض العروض':states[r.status].action):'تفاصيل الطلب';showDialog(title,`<p><strong>${esc(r.title)}</strong></p><div class="detail-line"><span>الخدمة</span><strong>${esc(r.service)}</strong></div><div class="detail-line"><span>الحالة</span><strong>${states[r.status].label}</strong></div><div class="detail-line"><span>العروض</span><strong>${offerText(r.offers)}</strong></div><div class="detail-line"><span>آخر موعد</span><strong>${dateText(r.deadline)}</strong></div>${mode==='action'&&r.status==='confirm'?'<p style="margin-top:16px;color:var(--muted)">محاكاة لتأكيد الاتفاق والانتقال إلى مرحلة التنفيذ.</p>':''}<div class="dialog-footer"><button class="btn" data-close>إغلاق</button>${mode==='action'&&r.status==='confirm'?`<button class="btn primary" data-confirm="${r.id}">تأكيد الاتفاق</button>`:''}</div>`);if(mode==='action'&&r.status==='open'&&r.offers){r.newOffers=0;render()}}
function showNew(){showDialog('طلب خدمة جديد',`<form id="request-form"><label for="new-title">عنوان الطلب</label><input class="field" id="new-title" required maxlength="120" placeholder="مثال: تصميم فيلا سكنية"><label for="new-service">نوع الخدمة</label><select class="field" id="new-service"><option>تصميم معماري</option><option>تصميم إنشائي</option><option>حصر كميات</option><option>إشراف على التنفيذ</option><option>إدارة مشروع</option></select><label for="new-date">آخر موعد للتقديم</label><input class="field" id="new-date" type="date" required><div class="dialog-footer"><button type="button" class="btn" data-close>إلغاء</button><button class="btn primary" type="submit">إنشاء الطلب</button></div></form>`);const today=new Date();$('new-date').min=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;$('request-form').addEventListener('submit',e=>{e.preventDefault();let title=$('new-title').value.trim();if(!title)return;requests.unshift({id:Date.now(),title,service:$('new-service').value,deadline:$('new-date').value,created:new Date().toISOString().slice(0,10),project:'',offers:0,newOffers:0,status:'open'});dialog.close();$('search').value='';setFilter('all');notify('تم إنشاء الطلب التجريبي')})}
let timer;function notify(message){clearTimeout(timer);$('toast').textContent=message;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,2800)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){closeMenus();return}if(b.dataset.menu){const m=$('menu-'+b.dataset.menu);const open=m.hidden;closeMenus();m.hidden=!open;b.setAttribute('aria-expanded',String(open));return}closeMenus();if(b.dataset.filter)setFilter(b.dataset.filter);if(b.hasAttribute('data-reset')){$('search').value='';setFilter('all')}if(b.dataset.detail||b.dataset.action){const id=Number(b.dataset.detail||b.dataset.action);const r=requests.find(r=>r.id===id);if(r)showDetail(r,b.dataset.action?'action':'detail')}if(b.dataset.cancel){const r=requests.find(r=>r.id===Number(b.dataset.cancel));showDialog('إلغاء الطلب',`<p>هل تريد إلغاء طلب «${esc(r.title)}»؟</p><div class="dialog-footer"><button class="btn" data-close>رجوع</button><button class="btn primary" data-cancel-confirm="${r.id}">إلغاء الطلب</button></div>`)}if(b.dataset.cancelConfirm){const r=requests.find(r=>r.id===Number(b.dataset.cancelConfirm));r.status='cancelled';dialog.close();render();notify('تم إلغاء الطلب')}if(b.dataset.confirm){const r=requests.find(r=>r.id===Number(b.dataset.confirm));r.status='progress';dialog.close();render();notify('تم تأكيد الاتفاق تجريبيًا')}if(b.hasAttribute('data-close'))dialog.close()});
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('new-request').addEventListener('click',showNew);$('close-dialog').addEventListener('click',()=>dialog.close());document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});render();
</script>
</body>
</html>
